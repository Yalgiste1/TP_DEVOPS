root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main main.go"
bin = "tmp/main"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor"]
delay = 1000
stop_on_error = true
log = "build-errors.log"

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
app = ""
